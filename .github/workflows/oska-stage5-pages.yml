name: OSKA Stage 5 Static Preview

on:
  push:
    branches:
      - oska-web-stage5-qa-20260922
    paths:
      - 'safe-staging/**'
      - '.github/workflows/oska-stage5-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oska-stage5-static-preview
  cancel-in-progress: true

jobs:
  build-and-publish-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safe-staging
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build and quality gates
        run: npm run build

      - name: Prepare static preview artifact
        run: |
          rm -rf /tmp/oska-stage5-preview
          mkdir -p /tmp/oska-stage5-preview
          cp -R dist/. /tmp/oska-stage5-preview/
          touch /tmp/oska-stage5-preview/.nojekyll

      - name: Publish isolated preview branch
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan oska-stage5-static-preview
          git rm -rf . || true
          git clean -fdx
          cp -R /tmp/oska-stage5-preview/. .
          git add -A
          git commit -m "OSKA Stage 5 static preview"
          git push --force origin HEAD:oska-stage5-static-preview
